<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeuroCore X — Cognitive Architecture</title>
<style>
  :root {
    --bg: #0d0f1a;
    --panel: #131726;
    --panel-2: #1a2036;
    --border: #262c47;
    --accent: #5b8cff;
    --accent-soft: #2a3660;
    --text: #e6e9f5;
    --text-dim: #8890b5;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Consolas', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .title { display: flex; align-items: center; gap: 10px; }
  header .title h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
  header .title span { font-size: 12px; color: var(--text-dim); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

  .layout { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 18px;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }
  .sidebar h2:first-child { margin-top: 0; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row .val { font-weight: 600; color: var(--accent); }
  .stat-row .val.warn { color: var(--yellow); }

  .quickcmds button {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Consolas', monospace;
  }
  .quickcmds button:hover { background: var(--accent-soft); border-color: var(--accent); }

  .main { flex: 1; display: flex; flex-direction: column; }
  .conversation {
    flex: 1;
    overflow-y: auto;
    padding: 20px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 720px; }
  .msg.user { align-self: flex-end; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    white-space: pre-wrap;
    font-family: 'Consolas', 'Courier New', monospace;
    line-height: 1.5;
  }
  .msg.user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 2px; }
  .msg.system .bubble { background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg .label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  .inputbar {
    display: flex;
    gap: 10px;
    padding: 16px 26px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .inputbar input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Consolas', monospace;
  }
  .inputbar input:focus { outline: none; border-color: var(--accent); }
  .inputbar button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 22px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .inputbar button:hover { background: #4675e6; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>🧠 NEUROCORE X</h1>
    <span>Hybrid Cognitive Architecture</span>
  </div>
  <div class="status"><span class="dot"></span> SYSTEM ONLINE</div>
</header>

<div class="layout">
  <div class="sidebar">
    <h2>Cognitive System</h2>
    <div class="stat-row"><span>🔗 Concepts</span><span class="val" id="stat-concepts">0</span></div>
    <div class="stat-row"><span>⚡ Relationships</span><span class="val" id="stat-relationships">0</span></div>
    <div class="stat-row"><span>⚠ Conflicts</span><span class="val warn" id="stat-conflicts">0</span></div>
    <div class="stat-row"><span>🧩 Training Examples</span><span class="val" id="stat-examples">0</span></div>
    <div class="stat-row"><span>✅ Trained</span><span class="val" id="stat-trained">no</span></div>

    <h2>Quick Commands</h2>
    <div class="quickcmds">
      <button onclick="sendQuick('help')">help</button>
      <button onclick="sendQuick('memory')">memory</button>
      <button onclick="sendQuick('train')">train</button>
      <button onclick="sendQuick('evaluate')">evaluate</button>
      <button onclick="sendQuick('why')">why</button>
      <button onclick="sendQuick('snapshot list')">snapshot list</button>
    </div>
  </div>

  <div class="main">
    <div class="conversation" id="conversation">
      <div class="msg system">
        <div class="label">NeuroCore X</div>
        <div class="bubble">Welcome. Try: teach 1 + 1 = 4, then teach a few more, then train and ask 2 + 3.
Type 'help' to see all commands.</div>
      </div>
    </div>
    <div class="inputbar">
      <input id="cmdInput" type="text" placeholder="Ask NeuroCore something, or type a command..." autofocus>
      <button onclick="sendCommand()">SEND</button>
    </div>
  </div>
</div>

<script>
const conversation = document.getElementById('conversation');
const input = document.getElementById('cmdInput');

function addMessage(text, who) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + who;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = who === 'user' ? 'You' : 'NeuroCore X';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(label);
  msg.appendChild(bubble);
  conversation.appendChild(msg);
  conversation.scrollTop = conversation.scrollHeight;
}

async function sendCommand() {
  const cmd = input.value.trim();
  if (!cmd) return;
  addMessage(cmd, 'user');
  input.value = '';

  try {
    const res = await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd })
    });
    const data = await res.json();
    addMessage(data.output || '(no output)', 'system');
  } catch (err) {
    addMessage('Error contacting NeuroCore X backend: ' + err, 'system');
  }
  refreshStats();
}

function sendQuick(cmd) {
  input.value = cmd;
  sendCommand();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendCommand();
});

async function refreshStats() {
  try {
    const res = await fetch('/api/stats');
    const s = await res.json();
    document.getElementById('stat-concepts').textContent = s.concepts;
    document.getElementById('stat-relationships').textContent = s.relationships;
    document.getElementById('stat-conflicts').textContent = s.conflicts;
    document.getElementById('stat-examples').textContent = s.trainingExamples;
    document.getElementById('stat-trained').textContent = s.trained ? 'yes' : 'no';
  } catch (err) {
    // backend not reachable yet; ignore
  }
}

refreshStats();
setInterval(refreshStats, 4000);
</script>

</body>
</html>
